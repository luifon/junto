[package]
name = "junto-client"
description = "The Junto desktop application: a gpui window on the client core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

build = "build.rs"

[lib]
name = "junto_client"

[[bin]]
name = "junto"
path = "src/main.rs"

# Draws every screen without a window and writes PNG files (ADR 0731).
[[bin]]
name = "junto-screens"
path = "src/bin/junto-screens.rs"
required-features = ["test-support"]

[[test]]
name = "app"
path = "tests/app/main.rs"
required-features = ["test-support"]

[features]
# The headless renderer and the test platform of gpui, for the tests and for `junto-screens`.
test-support = [
    "gpui/test-support",
    "gpui_platform/test-support",
    "gpui-base/test-support",
    "junto-media/test-support",
]

[dependencies]
junto-client-core = { path = "../client-core" }
junto-media = { path = "../media" }
# The fixed set of ADR 0701. The component library requires exactly this gpui snapshot.
# Only its unstyled layer is used so far: the root view, the focus trap and the text input.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "x11", "wayland"] }
gpui-base = "=0.7.1"
# The result of a write on a background thread returns to the interface thread through
# its one-time channel. gpui uses the same crate.
futures-channel = "0.3"
# The picture of a share is given to gpui as an image of this crate, in the version that
# gpui uses.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# The time zone of the system, for the times of messages. gpui uses the same crate.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The download directory of the person.
dirs = "5"
# The table of the standard emoji, in the version of the server: a reaction that the
# picker offers is one that the server accepts (ADR 0408).
emojis = "0.8"
# The address of a link is checked as the server checks it.
url = "2"
# The tokens of a code block, for its syntax colours (ADR 0740).
synoptic = "2.2"
# The identifiers of notices and of the scopes of notification settings (ADR 0409).
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
junto-client = { path = ".", features = ["test-support"] }
# The server inside the test process, for the tests that need its recorder in memory.
junto-server = { path = "../server" }
sqlx = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["io-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-video = { version = "0.5.2", features = ["metal"] }
# Read the real application bundle before registering system notifications.
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSString"] }
