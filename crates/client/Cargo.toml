[package]
name = "junto-client"
description = "The Junto desktop application: a gpui window on the client core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

build = "build.rs"

[lib]
name = "junto_client"

[[bin]]
name = "junto"
path = "src/main.rs"

# Draws every screen without a window and writes PNG files (ADR 0731).
[[bin]]
name = "junto-screens"
path = "src/bin/junto-screens.rs"
required-features = ["test-support"]

[[test]]
name = "app"
path = "tests/app/main.rs"
required-features = ["test-support"]

[features]
# The headless renderer and the test platform of gpui, for the tests and for `junto-screens`.
test-support = [
    "gpui/test-support",
    "gpui_platform/test-support",
    "gpui-base/test-support",
    "junto-media/test-support",
]

[dependencies]
junto-client-core = { path = "../client-core" }
junto-media = { path = "../media" }
# The fixed set of ADR 0701. The component library requires exactly this gpui snapshot.
# Only its unstyled layer is used so far: the root view, the focus trap and the text input.
gpui = { package = "gpui-pre", version = "=0.3.8" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "x11", "wayland"] }
gpui-base = "=0.7.1"
# The result of a write on a background thread returns to the interface thread through
# its one-time channel. gpui uses the same crate.
futures-channel = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
junto-client = { path = ".", features = ["test-support"] }
sqlx = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["io-util"] }
url = "2"
uuid = { workspace = true }
