[package]
name = "junto-icon"
description = "The application icon: renderings of its SVG source and the icon files of macOS and Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Writes the icon files that the packaging scripts put into the packages (ADR 0756).
[[bin]]
name = "junto-icon"
path = "src/main.rs"
required-features = ["render"]

[features]
default = ["render"]
# The renderer. A build script that has the crate as a build dependency turns it on only for
# the targets that use a rendering, so a build for another target does not compile resvg.
render = ["dep:resvg"]

[dependencies]
# The SVG renderer of gpui, in the version that gpui uses. The icon has no text and no
# raster pictures, so the features that read fonts and pictures are off.
resvg = { version = "0.46", default-features = false, optional = true }
thiserror = { workspace = true }

[lints]
workspace = true
