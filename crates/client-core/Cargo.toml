[package]
name = "junto-client-core"
description = "The Junto client without a user interface: local storage, device keys, the API client and the join and login flows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "junto-cli"
path = "src/bin/junto-cli/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[features]
# For a test of a crate that reads the state of a server: the test publishes a state, a
# notice and a state of the access flow without a server.
test-support = []

[dependencies]
# Role order by the functions that the server uses (ADR 0791). No permission is computed
# with it: the server states the permissions of the account (ADR 0790).
junto-authz = { workspace = true }
junto-protocol = { workspace = true }
base64 = { workspace = true }
bytes = "1"
ed25519-dalek = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
# The 0.12 line with the trust store of the operating system (ADR 0714).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
# The version that a server states, with its pre-release, in the order of semantic versions
# (ADR 0780).
semver = "1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
# The frames of the event stream. The HTTP library makes the upgrade request (ADR 0718).
tokio-tungstenite = { workspace = true }
tracing = { workspace = true }
url = "2"
# The identifiers of notices and of the scopes of notification settings (ADR 0409).
uuid = { workspace = true }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process", "stdio", "termios"] }

[target.'cfg(windows)'.dependencies]
# The key of the identity of the application for the notifications (ADR 0742). gpui uses the
# same crate for the same key.
windows-registry = "0.6"
# The properties of the main window for the taskbar (ADR 0755), through the interfaces of the
# shell. gpui uses the same version.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_EnhancedStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    # The notification setting of the application (ADR 0708).
    "UI_Notifications",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# The status item of the menu bar (ADR 0759), in the versions that gpui and the client use.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSButton",
    "NSControl",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
    "objc2-core-foundation",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSError",
    "NSData",
    "NSGeometry",
    "NSObject",
    "NSString",
    "objc2-core-foundation",
] }
# The notification permission of the application (ADR 0708), in the versions that gpui uses.
block2 = "0.6"
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "bitflags",
    "block2",
    "UNNotificationSettings",
    "UNUserNotificationCenter",
] }

[dev-dependencies]
# The server inside the test process, for the tests that need its recorder in memory.
junto-server = { path = "../server" }
# An executor without a tokio runtime, as the window has (ADR 0715).
futures-executor = "0.3"
sqlx = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["io-util", "test-util"] }
# A TLS server inside the test process for the upgrade of the event stream (ADR 0718).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1", features = ["pty"] }

# The workspace forbids unsafe code. This crate denies it and allows it in five modules that
# exist on Windows only and one that exists on macOS only: the library reads and sets owners
# and access lists (ADR 0711), attaches a program of the Windows subsystem to the console of
# its parent, sets the taskbar properties of a window (ADR 0755), shows the icon of the
# notification area of Windows and the status item of the macOS menu bar (ADR 0759), and the
# tool turns the echo of the console off (ADR 0711).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
large_stack_frames = "deny"

[build-dependencies]
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
# The icon of the recovery program on Windows (ADR 0756). Only the build for Windows
# compiles the renderer.
junto-icon = { path = "../icon", default-features = false }
serde_json = { workspace = true }
url = "2"

[target.'cfg(windows)'.build-dependencies]
junto-icon = { path = "../icon", features = ["render"] }
