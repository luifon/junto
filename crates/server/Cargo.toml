[package]
name = "junto-server"
description = "The Junto server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "junto-server"
path = "src/main.rs"

[[bin]]
name = "junto-openapi"
path = "src/bin/openapi.rs"

[[test]]
name = "api"
path = "tests/api/main.rs"

[[test]]
name = "openapi"
path = "tests/openapi.rs"

[dependencies]
junto-authz = { workspace = true, features = ["serde"] }
junto-protocol = { workspace = true, features = ["sqlx", "openapi"] }
axum = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
emojis = "0.8"
futures-util = { workspace = true }
getrandom = { workspace = true }
hyper = { workspace = true, features = ["client", "http1"] }
hmac = { workspace = true }
hyper-util = { workspace = true, features = ["client-legacy", "http1"] }
http-body-util = "=0.1.5"
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["ring", "native-tokio", "http1", "tls12"] }
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace", "metrics"] }
opentelemetry-proto = { version = "=0.33.1", default-features = false, features = ["gen-tonic-messages", "with-serde", "trace", "metrics"] }
reqwest = { workspace = true }
rustls-native-certs = "=0.8.4"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true, features = ["axum_extras"] }
utoipa-axum = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }

[dev-dependencies]
tower = { version = "=0.5.3", features = ["util"] }
junto-setup = { workspace = true }
tokio-tungstenite = { workspace = true, features = ["connect"] }

# The workspace forbids unsafe code. This crate denies it and allows it in two modules that
# exist on Windows only: one reads the free space of a directory (ADR 0605), one waits for the
# end of the process that started the server (ADR 0915).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
large_stack_frames = "deny"
