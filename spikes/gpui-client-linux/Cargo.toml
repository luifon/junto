[package]
name = "gpui-client-spike"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[[bin]]
name = "spike"
path = "src/main.rs"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["profiler"] }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.8", features = ["font-kit", "x11", "wayland"] }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.8" }
gpui-component = { version = "=0.7.1", features = ["tree-sitter-rust", "tree-sitter-toml"] }
gpui-kit-assets = "=0.7.1"
gpui-base = "=0.7.1"
anyhow = "1"
futures = "0.3"
log = "0.4"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }

[[bin]]
name = "secret_test"
path = "src/bin/secret_test.rs"

[target.'cfg(target_os = "linux")'.dependencies]
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-video = { version = "0.5.2", features = ["metal"] }
core-foundation = "0.10"

[profile.release]
debug = false
