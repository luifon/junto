[package]
name = "test-participant"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.11"
futures-util = "0.3"
livekit = { version = "0.9.4", features = ["rustls-tls-native-roots"] }
livekit-api = { version = "0.8.2", default-features = false, features = ["access-token"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
