# Form 2 of ADR 0003, the public host: the media server, Redis, the entry on port 443 and
# one end of the private link.
#
#   cd deploy && docker compose -f two-hosts-public.yaml run --rm link genkey
#   cd deploy && docker compose -f two-hosts-public.yaml up -d --build
#
# The media server and the entry use the network of the host. The link publishes its UDP
# port; no other container publishes a port. The link forwards three TCP ports and no IP
# packets: Redis and the API of the media server toward the data host, and the HTTP port of
# the server from the data host to the entry and the media server (ADR 0015).
#
# The forwarded HTTP port listens in the network "inbound", which has the link as its only
# container. The server trusts the forwarded client address of every request that arrives
# through the link, so only the entry and the media server, which are on the host, may
# reach that port.

name: junto-public

services:
  redis:
    extends:
      file: base.yaml
      service: redis
    environment:
      REDIS_PASSWORD: ${JUNTO_REDIS_PASSWORD:?set JUNTO_REDIS_PASSWORD in deploy/.env (deploy/generate-secrets.sh)}
      REDISCLI_AUTH: ${JUNTO_REDIS_PASSWORD:?set JUNTO_REDIS_PASSWORD in deploy/.env (deploy/generate-secrets.sh)}
    networks:
      backend:
        ipv4_address: ${JUNTO_BACKEND_REDIS:-172.31.240.11}

  livekit:
    extends:
      file: base.yaml
      service: livekit
    network_mode: host
    environment:
      JUNTO_CHECK_1: ${JUNTO_LIVEKIT_API_KEY:?set JUNTO_LIVEKIT_API_KEY in deploy/.env}
      JUNTO_CHECK_2: ${JUNTO_LIVEKIT_API_SECRET:?set JUNTO_LIVEKIT_API_SECRET in deploy/.env}
      JUNTO_CHECK_3: ${JUNTO_REDIS_PASSWORD:?set JUNTO_REDIS_PASSWORD in deploy/.env}
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - 127.0.0.1
          - ${JUNTO_BACKEND_GATEWAY:-172.31.240.1}
        keys:
          ${JUNTO_LIVEKIT_API_KEY:?set JUNTO_LIVEKIT_API_KEY in deploy/.env (deploy/generate-secrets.sh)}: ${JUNTO_LIVEKIT_API_SECRET:?set JUNTO_LIVEKIT_API_SECRET in deploy/.env (deploy/generate-secrets.sh)}
        redis:
          address: ${JUNTO_BACKEND_REDIS:-172.31.240.11}:6379
          password: ${JUNTO_REDIS_PASSWORD:?set JUNTO_REDIS_PASSWORD in deploy/.env (deploy/generate-secrets.sh)}
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: ${JUNTO_PUBLIC_IP:?set JUNTO_PUBLIC_IP in deploy/.env}
          stun_servers:
            - ${JUNTO_TURN_HOST:?set JUNTO_TURN_HOST in deploy/.env}:3478
        turn:
          enabled: true
          domain: ${JUNTO_TURN_HOST:?set JUNTO_TURN_HOST in deploy/.env}
          tls_port: 5349
          external_tls: true
          udp_port: 3478
        webhook:
          api_key: ${JUNTO_LIVEKIT_API_KEY:?set JUNTO_LIVEKIT_API_KEY in deploy/.env}
          urls:
            - http://${JUNTO_INBOUND_LINK:-172.31.242.12}:8080/internal/media/notifications
        logging:
          level: info
    depends_on:
      redis:
        condition: service_healthy

  entry:
    extends:
      file: base.yaml
      service: entry
    environment:
      JUNTO_ACME_EMAIL: ${JUNTO_ACME_EMAIL:?set JUNTO_ACME_EMAIL in deploy/.env}
      JUNTO_SERVER_HOST: ${JUNTO_SERVER_HOST:?set JUNTO_SERVER_HOST in deploy/.env}
      JUNTO_LIVEKIT_HOST: ${JUNTO_LIVEKIT_HOST:?set JUNTO_LIVEKIT_HOST in deploy/.env}
      JUNTO_TURN_HOST: ${JUNTO_TURN_HOST:?set JUNTO_TURN_HOST in deploy/.env}
      JUNTO_ENTRY_SERVER_UPSTREAM: ${JUNTO_INBOUND_LINK:-172.31.242.12}:8080

  link:
    extends:
      file: base.yaml
      service: link
    environment:
      LINK_ADDRESS: ${JUNTO_LINK_PUBLIC_ADDRESS:-10.99.0.1}
      LINK_PEER_ADDRESS: ${JUNTO_LINK_DATA_ADDRESS:-10.99.0.2}
      # Not required here: "link genkey" runs before the key of the other host exists. The
      # link container stops with a message while it is missing.
      LINK_PEER_PUBLIC_KEY: ${JUNTO_LINK_DATA_PUBLIC_KEY:-}
      LINK_PEER_PUBLIC_KEY_SETTING: JUNTO_LINK_DATA_PUBLIC_KEY
      LINK_LISTEN_PORT: "51820"
      LINK_FORWARDS: >-
        ${JUNTO_LINK_PUBLIC_ADDRESS:-10.99.0.1}:6379=${JUNTO_BACKEND_REDIS:-172.31.240.11}:6379
        ${JUNTO_LINK_PUBLIC_ADDRESS:-10.99.0.1}:7880=${JUNTO_BACKEND_GATEWAY:-172.31.240.1}:7880
        ${JUNTO_INBOUND_LINK:-172.31.242.12}:8080=${JUNTO_LINK_DATA_ADDRESS:-10.99.0.2}:8080
    ports:
      - ${JUNTO_LINK_PORT:-51820}:51820/udp
    networks:
      backend:
        ipv4_address: ${JUNTO_BACKEND_LINK:-172.31.240.12}
      inbound:
        ipv4_address: ${JUNTO_INBOUND_LINK:-172.31.242.12}

volumes:
  entry-data:
  link-keys:

networks:
  backend:
    ipam:
      config:
        - subnet: ${JUNTO_BACKEND_SUBNET:-172.31.240.0/24}
          gateway: ${JUNTO_BACKEND_GATEWAY:-172.31.240.1}
  inbound:
    ipam:
      config:
        - subnet: ${JUNTO_INBOUND_SUBNET:-172.31.242.0/24}
          gateway: ${JUNTO_INBOUND_GATEWAY:-172.31.242.1}
