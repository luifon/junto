# Who connects to the PostgreSQL of a Junto deployment, and how (ADR 0022). The Compose
# files give this file to PostgreSQL in place of the one in the data directory, so the rules
# are the ones of the release in use.
#
# The socket exists inside the container of PostgreSQL only. The scripts of the deployment
# use it for the administration, as the first user of the data directory, which has every
# right.
local   all   all                  trust
# Over the network only the role of the server connects, with its password. No line names
# another role, so the first user has no path over the network.
host    all   junto_server   all   scram-sha-256
