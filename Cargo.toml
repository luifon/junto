[workspace]
resolver = "3"
members = ["crates/*"]
exclude = [
    "spikes",
    "vendor/cpal-0.18.2",
    "vendor/gpui-pre-0.3.8",
    "vendor/gpui-pre-linux-0.3.8",
    "vendor/gpui-pre-scheduler-0.3.8",
    "vendor/livekit-0.9.4",
    "vendor/webrtc-sys-0.3.48",
    "vendor/webrtc-sys-build-0.3.19",
]

[patch.crates-io]
# cpal enters no apartment of COM on threads that it does not own (ADR 0733).
cpal = { path = "vendor/cpal-0.18.2" }
# A panic in a callback of the platform stops in gpui, and gpui puts its state back (ADR 0757).
gpui-pre = { path = "vendor/gpui-pre-0.3.8" }
gpui-pre-scheduler = { path = "vendor/gpui-pre-scheduler-0.3.8" }
# A press on a notification gives the window the focus on Wayland with the token of the press (ADR 0757).
gpui-pre-linux = { path = "vendor/gpui-pre-linux-0.3.8" }
livekit = { path = "vendor/livekit-0.9.4" }
webrtc-sys = { path = "vendor/webrtc-sys-0.3.48" }
webrtc-sys-build = { path = "vendor/webrtc-sys-build-0.3.19" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
junto-authz = { path = "crates/authz" }
junto-protocol = { path = "crates/protocol" }
junto-setup = { path = "crates/setup" }

axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
base64 = "0.23"
ed25519-dalek = "3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
hmac = "0.13"
hyper = { version = "1", default-features = false }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
proptest = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "migrate", "json", "derive", "macros"] }
subtle = "2"
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync", "process", "fs", "io-util"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
utoipa = { version = "6", features = ["uuid", "time"] }
utoipa-axum = "0.3"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
# A function whose values need more stack than the bound of clippy.toml (ADR 0906).
large_stack_frames = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The schema functions that the derive macro makes for the large enums of the protocol are
# one expression each. Without optimization such a function needs several hundred KiB of
# stack, because every value of the expression gets a place of its own (ADR 0906).
[profile.dev.package.junto-protocol]
opt-level = 1
