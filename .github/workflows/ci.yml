# The checks of every commit (ADR 0902, ADR 0905). The steps of each job are the script of
# tools/ci/ that the job calls, so that a Linux host and a macOS machine run the same steps
# (tools/ci/ci.sh); this file prepares the runner and calls the script. Every action is named
# by its commit hash, every container image by its digest (tools/ci/pins.sh), every package
# that a step installs with apt-get or that the Linux build image installs by its version,
# and every other file that the Linux build image downloads by its SHA-256;
# tools/check-pins.sh fails when one is not.

name: CI

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust-linux:
    name: Rust on Linux
    # A pull request from a branch of this repository is already checked by its push.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The image of the Linux container, its PostgreSQL and LiveKit images and the target
      # directory of the workspace need more disk space than the runner has free.
      - name: Free disk space of the runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          df -h /
      - name: Rust on Linux
        run: tools/ci/rust-linux.sh

  rust-other-systems:
    name: Rust on ${{ matrix.system }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        system: [macos-15, windows-2025]
    runs-on: ${{ matrix.system }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust version of rust-toolchain.toml
        shell: bash
        run: |
          version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: rust-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      # The download of PostgreSQL for Windows is kept also when a test fails.
      - id: postgres-cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/junto-postgres
          key: postgres-windows-${{ hashFiles('tools/windows/with_test_postgres.py') }}
      - name: Rust on ${{ matrix.system }}
        shell: bash
        run: tools/ci/rust-other-systems.sh
      - if: always() && runner.os == 'Windows' && steps.postgres-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/junto-postgres
          key: postgres-windows-${{ hashFiles('tools/windows/with_test_postgres.py') }}

  licences:
    name: Licences of the Rust dependencies
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Rust version of rust-toolchain.toml
        shell: bash
        run: |
          version=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$version" --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - name: Licences of the Rust dependencies
        run: tools/ci/licences.sh

  layout-page:
    name: Recording layout page
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.3
      - name: Recording layout page
        run: tools/ci/layout-page.sh

  transcription-worker:
    name: Transcription worker
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv 0.11.13
        run: pipx install uv==0.11.13
      - name: Transcription worker
        run: tools/ci/transcription-worker.sh

  deployment:
    name: Images and the Compose deployment
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # deploy/tests/upgrade.sh reads the files of an earlier commit.
          fetch-depth: 0
      # The server refuses new files while its disk has 5 GiB or less of free space
      # (ADR 0605), and the images of this job fill several GB of the disk of the runner.
      # The hosted image holds toolchains that this job does not use.
      - name: Free disk space of the runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          df -h /
      - name: Images and the Compose deployment
        run: tools/ci/deployment.sh
