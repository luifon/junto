# The contributor licence agreement of each pull request (ADR 0907). Each author of a commit
# signs by a comment with the sentence below; the action records the signature in the file
# .github/cla/signatures.json of the branch cla-signatures, which is not protected. The
# workflow checks out no code of the pull request.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, closed]

permissions: {}

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    name: CLA
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
      (github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the Junto contributor licence agreement and I sign it.'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: .github/cla/signatures.json
          path-to-document: https://github.com/luifon/junto/blob/main/CONTRIBUTING.md#contributor-licence-agreement
          branch: cla-signatures
          allowlist: luifon,*[bot]
          custom-pr-sign-comment: I have read the Junto contributor licence agreement and I sign it.
          custom-notsigned-prcomment: >-
            Thank you for the pull request. Junto accepts a contribution after each author of
            its commits has signed the contributor licence agreement that
            [CONTRIBUTING.md](https://github.com/luifon/junto/blob/main/CONTRIBUTING.md#contributor-licence-agreement)
            describes. To sign it, post a comment on this pull request with exactly the
            sentence below.
          custom-allsigned-prcomment: >-
            Each author of the commits of this pull request has signed the contributor
            licence agreement.
          create-file-commit-message: Create the file of the contributor licence agreement signatures
          signed-commit-message: $contributorName signed the contributor licence agreement in $owner/$repo
